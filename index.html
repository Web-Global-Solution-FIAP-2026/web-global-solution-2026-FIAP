<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ORION Mission OS — Plataforma de validação e simulação de missões CubeSat.">
  <title>ORION Mission OS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Orbitron:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="header" id="top">
    <div class="header__inner">
      <a href="#top" class="logo">ORION <span>Mission OS</span></a>

      <button class="nav-toggle" id="nav-toggle" aria-label="Abrir menu" aria-expanded="false">
        <span></span><span></span>
      </button>

      <nav class="nav" id="main-nav" aria-label="Navegação principal">
        <ul class="nav__list">
          <li><a href="#problema" class="nav__link">Problema</a></li>
          <li><a href="#tecnologia" class="nav__link">Tecnologia</a></li>
          <li><a href="#objetivos" class="nav__link">Objetivos</a></li>
          <li><a href="#publico-alvo" class="nav__link">Público-Alvo</a></li>
          <li><a href="#beneficios" class="nav__link">Benefícios</a></li>
          <li><a href="#aplicacao" class="nav__link">Aplicação</a></li>
          <li><a href="#galeria" class="nav__link">Galeria</a></li>
          <li><a href="#missao" class="nav__link">Missão</a></li>
          <li><a href="#quiz" class="nav__link">Quiz</a></li>
        </ul>
      </nav>

      <div class="theme-switcher" aria-label="Seletor de tema">
        <button class="theme-btn active" data-theme="mission-control">Control</button>
        <button class="theme-btn" data-theme="deep-space">Deep Space</button>
        <button class="theme-btn" data-theme="nebula">Nebula</button>
      </div>
    </div>
  </header>

  <section class="hero" aria-labelledby="hero-title">
    <div class="hero__bg">
      <img src="img/space-01.jpg" alt="" aria-hidden="true">
      <div class="hero__overlay"></div>
    </div>
    <div class="hero__inner fade-in">
      <p class="hero__label">Mission Control Platform</p>
      <h1 id="hero-title" class="hero__title">ORION Mission OS</h1>
      <p class="hero__desc">Validação, simulação orbital e telemetria para missões CubeSat.</p>
      <div class="hero__actions">
        <a href="#missao" class="btn btn--primary">Registrar missão</a>
        <a href="#problema" class="btn btn--outline">Conhecer solução</a>
      </div>
    </div>
  </section>

  <script src="js/script.js"></script>
</body>
</html>
